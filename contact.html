<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Preise</title>
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <header>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Kontakt</a>
            <a href="einloggen.html">Login</a>
        </header>
        <main class="kontakt">
            <form>
                <h1 class="kontakth1">Kontakt</h1>
                <div class="fname">
                    <label for="fname">
                        Vorname
                    </label>
                    <input
                            type="text"
                            id="fname"
                            name="Name"
                            placeholder="Max"
                            required>
                </div>
                <div class="lname">
                    <label for="lname">
                        Nachname
                    </label>
                    <input 
                            type="text"
                            id="lname"
                            name="Lastname"
                            placeholder="Mustermann"
                            required>
                </div>
                <div class="email">
                    <label for="email">
                        E-Mail-Adresse
                    </label>
                    <input
                    type="email"
                    id="email"
                    name="Email"
                    placeholder="Deine e-Mail-Adresse"
                    required
                    >
                </div>
                <div class="phone">
                    <label for="phone">
                        Telefonnumber
                    </label>
                    <input
                    type="tel"
                    id="phone"
                    name="Phone"
                    placeholder="Deine Telefonnummer"
                    >
                </div>
                <div class="message">
                    <label for="message">
                        Nachricht
                    </label>
                    <textarea
                    id="message"
                    name="Message"
                    cols="30"
                    rows="8">
                    </textarea>
                </div>
                <div class="submit">
                    <button>
                        Absenden
                    </button>
                </div>
            </form>
        </main>
    </body>
</html>
